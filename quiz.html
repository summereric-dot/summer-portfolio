<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <link href="./quizstyle.css" type="text/css" rel="stylesheet">
    <title>Portfolio Quiz</title>
</head>

<body>
    <main>
        <h1>Portfolio Quiz</h1>
        <h3></h3>
        <div id="quiz"></div>

        <button id="submit" type="button">Submit Quiz</button>

        <div id="results" role="status"aria-live="polite"></div>
    </main>

    <script src="./quiz.js"></script>

    <h2>Practice Questions</h2>
    <p id="questionText"></p>
    <input id="answerInput" type="text" placeholder="Type your answer">
    <button id="checkButton">Check Answer</button>
    <p id="feedback" role="status" aria-live="polite"></p>
</body>
</html>
